<script>
(function () {
  var ITER = 300000;
  var KEY_STORE = 'ano-gate-key-v1';
  var dec = new TextDecoder();
  function b64(s) { s = s.replace(/\s+/g, ''); var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function b64enc(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var salt = b64(document.getElementById('salt').textContent);
  var iv = b64(document.getElementById('iv').textContent);
  var payload = b64(document.getElementById('payload').textContent);
  var gate = document.getElementById('gate'), form = document.getElementById('form'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go'), remember = document.getElementById('remember');

  function reveal(html) {
    try { document.open(); document.write(html); document.close(); } catch (e) { document.documentElement.innerHTML = html; }
  }
  function store(raw) { try { localStorage.setItem(KEY_STORE, b64enc(new Uint8Array(raw))); } catch (e) {} }
  function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

  async function keyFromPassword(p) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function tryKey(key) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, payload);
    return dec.decode(plain);
  }
  async function tryStored() {
    var saved = null;
    try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (!saved) return false;
    try {
      var key = await crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, true, ['decrypt']);
      reveal(await tryKey(key));
      return true;
    } catch (e) { forget(); return false; }
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    err.textContent = '';
    go.disabled = true; document.body.classList.add('busy');
    try {
      var key = await keyFromPassword(pw.value);
      var html = await tryKey(key);
      if (remember.checked) store(await crypto.subtle.exportKey('raw', key)); else forget();
      reveal(html);
    } catch (e) {
      err.textContent = "That's not it. Check the password and try again.";
      pw.select();
    } finally {
      go.disabled = false; document.body.classList.remove('busy');
    }
  });

  if (!window.crypto || !crypto.subtle || !window.isSecureContext) {
    gate.hidden = false;
    err.textContent = 'This page needs a modern browser over https.';
    return;
  }
  tryStored().then(function (ok) { if (!ok) { gate.hidden = false; pw.focus(); } });
})();
</script>
